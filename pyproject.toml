[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-agent"
version = "0.1.0"
description = "Agentic Financial Operations Assistant with deterministic policy guardrails and human-in-the-loop oversight."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Build 2026 Team"}
]

dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "ulid-py>=1.1.0",
    "pyyaml>=6.0.0",
    "cryptography>=43.0.0,<44.1",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "shap>=0.46.0",
    "networkx>=3.3",
    "ortools>=9.11.0",
    "fastembed>=0.4.0",
]
agents = [
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "faker>=33.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
